// @file      account_risk.proto
// @brief     账户级硬风控与订单预占 gRPC 接口定义
// @details   E 段：引擎出站 ReserveOrder / ReleaseOrder / GetReservation；
//            按账户串行裁决额度预占与释放，与 config-service 实例级弱一致风险预算互补
// @author    wengjianhong
// @date      2026-07-15
// @copyright CC BY-NC-SA 4.0
syntax = "proto3";

package qtrade.account_risk.v1;

import "common/v1/meta.proto";

option cc_enable_arenas = true;

// 账户硬风控策略（租户 + 账户维度）
message AccountRiskPolicy {
    // 租户标识
    string tenant_id = 1;
    // 交易账户号
    string account_id = 2;
    // 策略版本；引擎 Reserve 时可携带以校验一致性
    uint64 version = 3;
    // 策略失效时间（Unix 毫秒）；0 表示由服务端默认 TTL 决定
    int64 valid_until_unix_ms = 4;
    // 最大名义敞口；0 表示不限制
    double max_notional = 5;
    // 最大保证金占用；0 表示不限制
    double max_margin = 6;
    // 最大总敞口；0 表示不限制
    double max_gross_exposure = 7;
    // 最大未完成订单数；0 表示不限制
    uint64 max_open_orders = 8;
    // 安全缓冲，从名义/保证金上限中预留
    double safety_buffer = 9;
    // 是否启用该账户硬风控
    bool enabled = 10;
}

// 订单意图（预占时由引擎提交）
message OrderIntent {
    // 全局订单 ID
    string order_id = 1;
    // 引擎实例标识
    string engine_id = 2;
    // 策略实例标识；可为空
    string strategy_id = 3;
    // 合约/品种标识
    string instrument_id = 4;
    // 买卖方向字符串表示
    string side = 5;
    // 委托价格
    double price = 6;
    // 委托数量
    uint64 quantity = 7;
    // 估算名义金额；0 时服务端可按 price × quantity 推导
    double estimated_notional = 8;
    // 估算保证金占用
    double estimated_margin = 9;
}

// 预占订单额度请求
message ReserveOrderRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
    // 订单意图
    OrderIntent intent = 4;
    // 引擎侧持有的风控策略版本；0 表示不校验版本
    uint64 risk_config_version = 5;
    // 预占有效期（毫秒）；0 表示使用服务端默认 TTL
    int64 reservation_ttl_ms = 6;
}

// 预占订单额度响应
message ReserveOrderResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 预占裁决结果
    enum Decision {
        // 未指定
        DECISION_UNSPECIFIED = 0;
        // 批准预占
        APPROVED = 1;
        // 拒绝预占
        REJECTED = 2;
        // 结果未知（如超时）；引擎须 GetReservation 反查
        UNKNOWN = 3;
    }
    // 裁决结果
    Decision decision = 2;
    // 拒绝原因码；批准时可为空
    string reject_reason = 3;
    // 实际生效的策略版本
    uint64 policy_version = 4;
    // 预占 ID
    string reservation_id = 5;
    // 预占过期时间（Unix 毫秒）
    int64 expires_at_unix_ms = 6;
}

// 释放订单预占请求
message ReleaseOrderRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 释放原因
    enum Reason {
        // 未指定
        REASON_UNSPECIFIED = 0;
        // EMS 入队或报送失败
        EMS_ENQUEUE_FAILED = 1;
        // 柜台拒单
        REJECTED_BY_VENUE = 2;
        // 订单已撤
        CANCELED = 3;
        // 订单已成交结算
        SETTLED = 4;
        // 预占已过期
        EXPIRED = 5;
    }
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
    // 全局订单 ID
    string order_id = 4;
    // 释放原因
    Reason reason = 5;
    // 已结算名义金额；SETTLED 时可填写
    double settled_notional = 6;
    // 已结算保证金；SETTLED 时可填写
    double settled_margin = 7;
}

// 释放订单预占响应
message ReleaseOrderResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 是否已释放（幂等：不存在也视为已释放）
    bool released = 2;
    // 失败原因；成功时可为空
    string reject_reason = 3;
}

// 列出账户有效预占请求
message ListActiveReservationsRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
}

// 单笔预占状态
message Reservation {
    // 全局订单 ID
    string order_id = 1;
    // 预占 ID
    string reservation_id = 2;
    // 状态：reserved / released / settled / expired 等
    string status = 3;
    // 预占过期时间（Unix 毫秒）
    int64 expires_at_unix_ms = 4;
}

// 查询指定订单预占状态请求
message GetReservationRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
    // 全局订单 ID
    string order_id = 4;
}

// 查询指定订单预占状态响应
message GetReservationResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 订单预占状态
    Reservation reservation = 2;
}

// 列出账户有效预占响应
message ListActiveReservationsResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 当前仍为 reserved 的预占列表
    repeated Reservation reservations = 2;
}

// 查询账户硬风控策略请求
message GetAccountRiskPolicyRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
}

// 查询账户硬风控策略响应
message GetAccountRiskPolicyResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 账户硬风控策略
    AccountRiskPolicy policy = 2;
}

// 写入或更新账户硬风控策略请求
message UpsertAccountRiskPolicyRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 待写入策略；version 不得回退
    AccountRiskPolicy policy = 2;
}

// 写入或更新账户硬风控策略响应
message UpsertAccountRiskPolicyResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
}

// 账户硬风控 gRPC 服务
service AccountRiskService {
    // 预占账户额度
    rpc ReserveOrder(ReserveOrderRequest) returns (ReserveOrderResponse);
    // 释放账户预占
    rpc ReleaseOrder(ReleaseOrderRequest) returns (ReleaseOrderResponse);
    // 查询指定订单的预占状态
    rpc GetReservation(GetReservationRequest) returns (GetReservationResponse);
    // 列出指定账户上的有效预占
    rpc ListActiveReservations(ListActiveReservationsRequest) returns (ListActiveReservationsResponse);
    // 查询账户硬风控策略
    rpc GetAccountRiskPolicy(GetAccountRiskPolicyRequest) returns (GetAccountRiskPolicyResponse);
    // 写入或更新账户硬风控策略
    rpc UpsertAccountRiskPolicy(UpsertAccountRiskPolicyRequest) returns (UpsertAccountRiskPolicyResponse);
}
