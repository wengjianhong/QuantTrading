// @file      config.proto
// @brief     配置中心 gRPC 接口定义
// @details   控制面：引擎出站 GetConfig / SubscribeConfig；仅下发策略与行情源等业务配置，不含账户凭证
// @author    wengjianhong
// @date      2026-06-28
// @copyright CC BY-NC-SA 4.0
syntax = "proto3";

package qtrade.config.v1;

option cc_enable_arenas = true;

// 策略配置
message StrategyConfig {
    // 策略实例标识
    string strategy_id = 1;
    // 策略插件名
    string plugin = 2;
    // 是否启用
    bool enabled = 3;
    // 订阅合约列表
    repeated string instruments = 4;
    // 策略参数键值对
    map<string, string> params = 5;
}

// 实例级弱一致风险预算。账户硬限制由 account-risk-service 独立裁决。
message RiskBudget {
    uint64 version = 1;
    double max_notional = 2;
    double max_margin = 3;
    uint64 max_open_orders = 4;
    double safety_buffer = 5;
}

// 引擎实例配置（按 engine_id 分片）
message EngineConfig {
    // 引擎实例标识
    string engine_id = 1;
    // 主行情源
    string quote_source = 2;
    // 策略绑定列表
    repeated StrategyConfig strategies = 3;
    // 租户标识；必须与引导配置一致
    string tenant_id = 4;
    // 引擎使用的交易账户引用，不含凭证
    string account_id = 5;
    // 备用行情源；空表示不启用自动切换
    string quote_failover = 6;
    // 实例级弱一致风险预算
    RiskBudget risk_budget = 7;
    // 配置原子生效世代；控制线程不得回退
    uint64 activation_epoch = 8;
    // 配置失效时间（Unix 毫秒）；0 表示由服务端默认 TTL 决定
    int64 valid_until_unix_ms = 9;
}

// 配置
message ConfigSnapshot {
    // 单调递增版本号
    uint64 version = 1;
    // 引擎业务配置
    EngineConfig engine = 2;
}

// 获取配置请求
message GetConfigRequest {
    // 引擎实例标识
    string engine_id = 1;
}

// 订阅配置请求
message SubscribeConfigRequest {
    // 引擎实例标识
    string engine_id = 1;
    // 客户端已接收的最新版本（0 表示获取最新配置）
    uint64 since_version = 2;
}

// 配置中心 gRPC 服务
service ConfigService {
    // 获取配置
    rpc GetConfig(GetConfigRequest) returns (ConfigSnapshot);
    // 订阅配置变更（Server Streaming）
    rpc SubscribeConfig(SubscribeConfigRequest) returns (stream ConfigSnapshot);
}
