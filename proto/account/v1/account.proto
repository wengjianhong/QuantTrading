// @file      account.proto
// @brief     交易账户服务 gRPC 接口定义
// @details   管理租户下的券商资金账户与登录凭证；平台系统用户鉴权不在此服务
// @author    wengjianhong
// @date      2026-07-08
// @copyright CC BY-NC-SA 4.0
syntax = "proto3";

package qtrade.account.v1;

import "common/v1/meta.proto";

option cc_enable_arenas = true;

// 交易账户（券商资金账号，租户内唯一）
message TradingAccount {
    // 租户标识
    string tenant_id = 1;
    // 交易账户号
    string account_id = 2;
    // 交易柜台标识
    string broker_id = 3;
    // 交易登录密码
    string password = 4;
    // 柜台网关连接参数（如 tcp://host:port；不含登录密码）
    string connection_string = 5;
    // 账户状态：active / disabled
    string status = 6;
}

// 添加交易账户请求
message AddAccountRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 账户信息
    TradingAccount account = 2;
}

// 添加交易账户响应
message AddAccountResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
}

// 查询单个交易账户请求
message GetAccountRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
}

// 查询单个交易账户响应
message GetAccountResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 账户元数据
    TradingAccount account = 2;
}

// 查询交易账户列表请求
message ListAccountsRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识（空表示不过滤）
    string tenant_id = 2;
}

// 查询交易账户列表响应
message ListAccountsResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 账户列表（password 置空）
    repeated TradingAccount accounts = 2;
}

// 更新交易账户请求
message UpdateAccountRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 待更新账户
    TradingAccount account = 2;
}

// 更新交易账户响应
message UpdateAccountResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
}

// 获取登录凭证信息请求
message GetCredentialRequest {
    // 统一请求链路元数据
    qtrade.common.meta.v1.RequestMeta meta = 1;
    // 租户标识
    string tenant_id = 2;
    // 交易账户号
    string account_id = 3;
    // 引擎实例标识
    string engine_id = 4;
}

// 仅供已授权引擎建立柜台连接使用的短生命周期凭证材料。
// 不用于账户查询、列表或配置接口。
message CredentialMaterial {
    string tenant_id = 1;
    string account_id = 2;
    string broker_id = 3;
    string connection_string = 4;
    string password = 5;
}

// 获取登录凭证信息响应
message GetCredentialResponse {
    // 统一响应链路元数据
    qtrade.common.meta.v1.ResponseMeta meta = 1;
    // 仅返回建立柜台连接所需材料；调用方不得记录或转发 password。
    CredentialMaterial credential = 2;
}

// 交易账户 gRPC 服务
service AccountService {
    // 添加交易账户
    rpc AddAccount(AddAccountRequest) returns (AddAccountResponse);
    // 查询单个交易账户
    rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
    // 查询交易账户列表
    rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
    // 更新交易账户
    rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
    // 获取登录凭证信息
    rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse);
}
